name: Bug report
description: Report a bug in this project.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not use this form for a security
        vulnerability; use private vulnerability reporting instead
        (see `SECURITY.md`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. Include any error message, exactly as shown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the exact steps that reproduce the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version, tag, or commit hash you ran.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version, and any other relevant detail.
    validations:
      required: true
